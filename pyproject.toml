[project]
dependencies = [
  "geopandas>=1.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyproj>=3.6",
  "shapely>=2.0",
]
description = "Deltares tools for Ground Penetrating Radar data preparation and QC"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]

name = "DeltaGPR"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
deltagpr-apply-offsets = "deltagpr.offsets:main"
deltagpr-clean-coordinates = "deltagpr.clean_coordinates:main"
deltagpr-edit-headers = "deltagpr.headers:main"
deltagpr-tracklines = "deltagpr.tracklines:main"
deltagpr_pipeline = "deltagpr.pipeline:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
deltagpr = { path = ".", editable = true }

[tool.pixi.dependencies]
ruff = ">=0.12"
pyinstaller = ">=6.0"

[tool.pixi.tasks]
install = "python -m pip install -e ."
apply_offsets = "deltagpr-apply-offsets"
clean_coordinates = "deltagpr-clean-coordinates"
edit_headers = "deltagpr-edit-headers"
tracklines = "deltagpr-tracklines"
build_exe = "pyinstaller --onefile --name deltagpr_pipeline --icon ../docs/deltagpr_icon.ico --distpath dist --workpath build --specpath build src/deltagpr/pipeline.py"
build_linux_executable = "pyinstaller --onefile --name deltagpr_pipeline --icon ../docs/deltagpr_icon.ico --distpath dist --workpath build --specpath build src/deltagpr/pipeline.py"
test = "python -m unittest discover -s tests"
lint = "ruff check ."

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "N", "I001"]
ignore = ["F401"]
unfixable = ["F401"]
